stages:
  - { id: todo,   owner: pmo,       output_section: null,         exit: "PMO picks it" }
  - { id: spec,   owner: pm,        output_section: Spec,         exit: "Human approves the spec" }
  - { id: design, owner: architect, output_section: Design,       exit: "Design written; Compliance passed if flagged" }
  - { id: build,  owner: engineer,  output_section: Build notes,  exit: "PR open and linked" }
  - { id: review, owner: reviewer,  output_section: Review log,   exit: "PASS (→ done) or REJECT (→ build)" }
terminal: [done, parked]

# Authority (decided by Merwyn, 25 Nov 2026): the office is self-managed inside this repo.
# PMO approves specs, Reviewer PASS is required before merge, PMO merges.
gates:
  - { stage: spec,   approver: pmo }
  - { stage: design, approver: compliance, when: "flagged by architect" }
  - { stage: done,   approver: reviewer }     # PASS required; then PMO merges the PR

human_gates:                                  # always stop and ask Merwyn
  - writes to any repo other than merwyns-maj/ai-office (company repos, brains)
  - creating repos, accounts, connectors or paid resources
  - anything touching production systems, money movement or personal data
  - a business decision between options with different cost or risk
  - compliance BLOCK
  - budget_used >= 0.8

escalation:
  - { when: "review_rejections >= 2",  to: human }
  - { when: "blocked_days > 3",         to: human }
  - { when: "budget_used >= 0.8",       to: human }
  - { when: "compliance == BLOCK",      to: human }

merge:
  who: pmo
  requires: [reviewer PASS, PR open from a t-xxx branch]
  # Exception (Janice, T-042): planning-only PRs from sprint-NN-* branches (sprint file, board.md, raid.md)
  # may merge without a Reviewer; the PMO merges them.
  requires_planning_only: [PR open from a sprint-NN-* branch, changes limited to sprints/, board.md, raid.md]
  method: squash

status_writers:
  default: pmo
  exceptions:
    - { agent: reviewer, may_set: [done, build], from: review }
    - { agent: human,    may_set: any }

after_done: curator         # records the decision once merged
