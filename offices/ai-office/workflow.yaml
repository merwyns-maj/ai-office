stages:
  - { id: todo,   owner: pmo,       output_section: null,         exit: "PMO picks it" }
  - { id: spec,   owner: pm,        output_section: Spec,         exit: "Human approves the spec" }
  - { id: design, owner: architect, output_section: Design,       exit: "Design written; Compliance passed if flagged" }
  - { id: build,  owner: engineer,  output_section: Build notes,  exit: "PR open and linked" }
  - { id: review, owner: reviewer,  output_section: Review log,   exit: "PASS (→ done) or REJECT (→ build)" }
terminal: [done, parked]

# Consults (T-047): an agent called inside a stage by the PMO or the stage owner. Not a stage: the consult
# writes only its own section and never sets status or owner. The task stays with the stage owner, who accepts it.
consults:
  - { agent: designer, stage: design, when: "the Spec or Design has UI, visual or motion work", output_section: UX design, accepted_by: architect }

# Authority (decided by Merwyn, 25 Nov 2026): the office is self-managed inside this repo.
# PMO approves specs, Reviewer PASS is required before merge, PMO merges.
gates:
  - { stage: spec,   approver: pmo }
  - { stage: design, approver: compliance, when: "flagged by architect" }
  - { stage: done,   approver: reviewer }     # PASS required; then PMO merges the PR

human_gates:                                  # always stop and ask Merwyn
  - writes to any repo other than merwyns-maj/ai-office (company repos, brains)
  - creating repos, accounts, connectors or paid resources
  - anything touching production systems, money movement or personal data
  - a business decision between options with different cost or risk
  - compliance BLOCK
  - budget_used >= 0.8

escalation:
  - { when: "review_rejections >= 2",  to: human }
  - { when: "blocked_days > 3",         to: human }
  - { when: "budget_used >= 0.8",       to: human }
  - { when: "compliance == BLOCK",      to: human }

merge:
  who: pmo
  requires: [reviewer PASS, PR open from a t-xxx branch]
  # Exception (Janice, T-042; widened in T-044): planning-only PRs from sprint-NN-* branches may merge
  # without a Reviewer; the PMO merges them. Planning-only means every change is one of:
  #   - sprints/, board.md, raid.md
  #   - a new backlog task file at status todo or spec
  #   - on an existing task file, only the frontmatter keys status, owner, depends_on (status never set to done)
  #     and appended dated decision notes, written by the PMO at sprint plan or close
  #   - offices/<office>/usage/: appended run lines to a session ledger (existing lines never edited), checked with `python -m engine.runtime ledger`
  # Anything else (Spec, Design, Build notes, Review log or Decision text, Done when, other frontmatter keys,
  # any other path) needs a Reviewer PASS.
  requires_planning_only: [PR open from a sprint-NN-* branch, changes limited to sprints/, board.md, raid.md, usage/ and plan-stage task edits (see comment)]
  method: squash

status_writers:
  default: pmo
  exceptions:
    - { agent: reviewer, may_set: [done, build], from: review }
    - { agent: human,    may_set: any }

after_done: curator         # records the decision once merged
